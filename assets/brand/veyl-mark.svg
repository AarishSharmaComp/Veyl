<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Veyl — folded veil mark</title>
  <desc id="desc">Two violet folds form a V around a small absent center, inside an inset rounded obsidian square. The outside corners are transparent.</desc>
