    <linearGradient id="container" x1="18" y1="9" x2="105" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#262135"/>
      <stop offset="1" stop-color="#0d0d16"/>
    </linearGradient>
    <linearGradient id="left-veil" x1="29" y1="31" x2="67" y2="101" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8c5ff"/>
      <stop offset=".48" stop-color="#ae83ff"/>
      <stop offset="1" stop-color="#8a56df"/>
    </linearGradient>
    <linearGradient id="right-veil" x1="98" y1="32" x2="63" y2="101" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bc98ff"/>
      <stop offset="1" stop-color="#6b42bf"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#container)" stroke="#4b3c65" stroke-width="2"/>
