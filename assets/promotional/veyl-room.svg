<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
  <title id="title">The room stays. A person fades.</title>
  <desc id="desc">Original editorial illustration of a curly-haired person in a violet sweatshirt dissolving from right to left into lilac fragments. Their face and raised hand remain recognizable. The window, desk, monitor, chair, books, lamp, and plants remain visible, including through the disappearing half of the person. This is an effect illustration, not a product screenshot.</desc>
