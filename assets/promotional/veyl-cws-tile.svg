<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
  <title id="title">Veyl small promotional tile</title>
  <desc id="desc">A compact original Veyl composition with the folded-V logo and a person dissolving in a room. Artwork for a separate store upload, not a screenshot.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="440" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171420"/>
      <stop offset="1" stop-color="#0d0d16"/>
    </linearGradient>
  </defs>
  <rect width="440" height="280" fill="url(#background)"/>
  <image href="../brand/veyl-mark.svg" x="19" y="22" width="38" height="38"/>
  <image href="../brand/veyl-wordmark.svg" x="67" y="28" width="100" height="25.81"/>
  <image href="veyl-room.svg" x="191" y="39" width="251" height="200.8"/>
  <g font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-kerning="none">
    <text x="23" y="122" fill="#f4effc" font-size="31" font-weight="700" letter-spacing="-.7">Present,</text>
    <text x="23" y="159" fill="#c1a0f6" font-size="31" font-weight="700" letter-spacing="-.7">not visible.</text>
    <text x="24" y="194" fill="#aaa2b8" font-size="12">Your room stays.</text>
    <text x="24" y="211" fill="#aaa2b8" font-size="12">You fade.</text>
    <text x="24" y="253" fill="#b58bec" font-size="10" font-weight="700" letter-spacing="1.2">LIVE CAMERA EFFECTS</text>
  </g>
</svg>
